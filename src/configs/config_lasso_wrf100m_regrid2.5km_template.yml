---
# Run in parallel
run_parallel: 1
# Number of workers for Dask
n_workers: 12  # For 3D calculations
# n_workers: 64  # For track statistics
# Threads per worker
threads_per_worker: 1
dask_tmp_dir: '/tmp'
# Start/end date and time
startdate: 'STARTDATE.1200'
enddate: 'ENDDATE.0000'
# Ensemble member name
ensmember: 'ENSMEMBER'
# wrfout domain name (d01: 500m, d02: 100m)
domain: 'd02'
# Resolution: 'meso' or 'les'
resolution: 'les'
# Maximum time difference allowed to match the datasets
time_window: 30  # [second]
# Input/output file locations
# Track stats directory
stats_path: '/gpfs/wolf2/arm/atm131/proj-shared/zfeng/cacti/les/STARTDATE/ENSMEMBER/CONFIG/d4_5min_2.5km/stats/'
# Track pixel file directory
pixelfile_path: '/gpfs/wolf2/arm/atm131/proj-shared/zfeng/cacti/les/STARTDATE/ENSMEMBER/CONFIG/d4_5min_2.5km/celltracking/'
# 3D Met file directory
metfile_path: '/gpfs/wolf2/arm/atm131/proj-shared/zfeng/cacti/les/regrid_subsets/STARTDATE/ENSMEMBER/CONFIG/les/subset_d4/'
cldfile_path: '/gpfs/wolf2/arm/atm131/proj-shared/zfeng/cacti/les/regrid_subsets/STARTDATE/ENSMEMBER/CONFIG/les/subset_d4/'
metfile_path_2: '/gpfs/wolf2/arm/atm131/proj-shared/zfeng/cacti/les/regrid_subsets/STARTDATE/ENSMEMBER/CONFIG/les/subset_d4/'
cldfile_path_2: '/gpfs/wolf2/arm/atm131/proj-shared/zfeng/cacti/les/regrid_subsets/STARTDATE/ENSMEMBER/CONFIG/les/subset_d4/'
# Output file directory
output_path: '/gpfs/wolf2/arm/atm131/proj-shared/zfeng/cacti/les/STARTDATE/ENSMEMBER/CONFIG/d4_5min_2.5km/stats/'
env_path: '/gpfs/wolf2/arm/atm131/proj-shared/zfeng/cacti/les/regrid_subsets/cell_envs3d/'
# File base names
pixel_filebase: 'celltracks_'
methamsl_filebase: 'corlasso_methamsl_STARTDATE00ENSMEMBERd4_CONFIG_M1.m1.'
cldhamsl_filebase: 'corlasso_cldhamsl_STARTDATE00ENSMEMBERd4_CONFIG_M1.m1.'
met_filebase: 'corlasso_met_STARTDATE00ENSMEMBERd4_CONFIG_M1.m1.'
cld_filebase: 'corlasso_cld_STARTDATE00ENSMEMBERd4_CONFIG_M1.m1.'
# W thresholds to define cores
W_up_thresh: 1.0  # [m/s]
W_down_thresh: -1.0  # [m/s]
# Hydrometeor thresholds to define moist updrafts
Q_up_thresh: 0.00001 # 0.01/1000  # [kg/kg]
Q_down_thresh: 0.00005 # 0.05/1000  # [kg/kg]
# Minimum pixel count for a core
min_core_npix: 1
# Number of cores to save per cell
ncores_min: 2
# Number of pixel to expand a core to get perimeter
core_expand_dist: 1
# Buffer radius to expand the cell mask to get the core shell / perimeter
core_shell_buffer_radius: 20  # [km]
# Number of hours prior to initiation to extract 1D environment
nhours: 1
# Minutes prior to initiation to extract 3D environment before CI
minutes_prior: 30
# Frequency of times to extract 3D environment data before CI
freq_prior: 15    # [min]
# Set domain size to extract environment
# Number of grid point in lon/lat dimension [center-nx, center+nx], [center-ny, center+ny]
# nx: 12
# ny: 12
nx: 4
ny: 4
nz: 149
# Sub-sample spatial grid (2: sample every 2 grids)
sub_x: 1
sub_y: 1
# Fixed location for ARM site to extract environment
lat_site: -32.126410
lon_site: -64.728370
# Spatial resolution
DX: 2500
DY: 2500
# Number of grid point to compute center environment profile [-nx_center, +nx_center], [-ny_center,+ny_center]
nx_center: 4
ny_center: 4
# List of 2D variables to pass through from the 3D file
list_var_pass:
  - 'conv_core'
  - 'conv_mask'
  - 'dbz_comp'
  - 'echotop10'
  - 'LWP'
  - 'IWP'
  - 'PWV'
  - 'T2'
  - 'Q2'
  - 'PSFC'
  - 'U10'
  - 'V10'
  - 'RAINNC'